<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="rc-grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c58a55" />
      <stop offset="100%" stop-color="#6f421f" />
    </linearGradient>
    <linearGradient id="rc-grad-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfad7c" />
      <stop offset="100%" stop-color="#b47b48" />
    </linearGradient>
    <linearGradient id="rc-grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#986134" />
      <stop offset="100%" stop-color="#5a3316" />
    </linearGradient>
    <linearGradient id="rc-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba8250" />
      <stop offset="100%" stop-color="#734220" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Squircle Container -->
  <rect width="48" height="48" rx="12" fill="url(#rc-grad-main)" />
  
  <!-- Isometric Architectural Room Geometry -->
  <!-- Top Plane -->
  <polygon points="24,10 37,17.5 24,25 11,17.5" fill="url(#rc-grad-top)" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round" opacity="0.95"/>
  
  <!-- Left Wall Plane -->
  <polygon points="11,17.5 24,25 24,38 11,30.5" fill="url(#rc-grad-left)" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round" opacity="0.92"/>
  
  <!-- Right Wall Plane -->
  <polygon points="24,25 37,17.5 37,30.5 24,38" fill="url(#rc-grad-right)" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round" opacity="0.95"/>
  
  <!-- Interior Architectural Elements -->
  <!-- Door frame on Left wall -->
  <polygon points="15,22 19,24.3 19,32.2 15,29.9" fill="#ffffff" fill-opacity="0.28" stroke="#ffffff" stroke-width="0.9"/>
  
  <!-- Window aperture on Right wall with reflective sky blue -->
  <polygon points="27,24.5 33,21 33,27 27,30.5" fill="#38bdf8" fill-opacity="0.65" stroke="#ffffff" stroke-width="0.9"/>
  
  <!-- Center Floor Axis Accent Node -->
  <circle cx="24" cy="25" r="1.4" fill="#ffffff"/>
</svg>